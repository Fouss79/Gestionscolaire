services:

  mysql:
    image: mysql:8.0
    container_name: school-mysql
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: school
      MYSQL_ROOT_PASSWORD: school123

    volumes:
      - school_mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pschool123"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build: .
    container_name: school-backend
    restart: unless-stopped

    depends_on:
      mysql:
        condition: service_healthy

    ports:
      - "8080:8080"

    environment:
      SPRING_PROFILES_ACTIVE: docker

volumes:
  school_mysql_data: